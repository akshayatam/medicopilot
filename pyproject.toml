[project]
name = "medicopilot"
version = "0.1.0"
description = "Local, synthetic-data medication navigation copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5,<7",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-mock>=3.14,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a running local Ollama instance and installed model"]
